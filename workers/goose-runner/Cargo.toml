[package]
name = "actestra-goose-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[dependencies]
async-trait = "=0.1.91"
futures = "=0.3.33"
goose = { git = "ssh://git@github.com/Ablankpaper/actestra-goose-runtime.git", rev = "e246f395592b01995cd34faf5e3ce1ed5444a41a", default-features = false }
goose-providers = { git = "ssh://git@github.com/Ablankpaper/actestra-goose-runtime.git", rev = "e246f395592b01995cd34faf5e3ce1ed5444a41a", default-features = false }
libc = "0.2"
rmcp = { version = "=2.2.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.48", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = false
