[package]
name = "actestra-goose-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
publish = false

[dependencies]
async-trait = "=0.1.91"
futures = "=0.3.33"
goose = { git = "ssh://git@github.com/Ablankpaper/actestra-goose-runtime.git", rev = "81bb2c1428d11e41e7934f4569eb7dda3fb55b81", default-features = false }
goose-providers = { git = "ssh://git@github.com/Ablankpaper/actestra-goose-runtime.git", rev = "81bb2c1428d11e41e7934f4569eb7dda3fb55b81", default-features = false }
libc = "0.2"
rmcp = { version = "=2.2.0", default-features = false }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.48", default-features = false, features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "=0.7.19", default-features = false, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Networking_WinSock",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = false

# crates.io yanked every published arrayref release currently selected by
# blake3. The upstream repository is no longer fetchable, so this exact
# pre-yank source is vendored under an Actestra-owned path with provenance and
# license records; do not silently accept a new registry package.
[patch.crates-io]
arrayref = { path = "vendor/arrayref" }
