appId: com.bignormal.actestra
productName: Actestra
executableName: Actestra
copyright: Copyright © 2026 Actestra

protocols:
  - name: Actestra Protocol
    schemes:
      - actestra

asar: true
publish: null

directories:
  output: release
  buildResources: apps/desktop/resources

files:
  - out/**/*
  - package.json
  - "!out/**/*.map"

extraResources:
  - from: node_modules/electron/dist/LICENSE
    to: LICENSE.electron.txt
  - from: node_modules/electron/dist/LICENSES.chromium.html
    to: LICENSES.chromium.html

extraMetadata:
  main: out/main/index.js

mac:
  identity: null
  category: public.app-category.productivity
  icon: apps/desktop/resources/Actestra.icns
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false
  minimumSystemVersion: 12.0.0
  entitlements: apps/desktop/entitlements.mac.plist
  entitlementsInherit: apps/desktop/entitlements.mac.plist
  extendInfo:
    NSHighResolutionCapable: true

dmg:
  format: UDZO
  internetEnabled: false
  window:
    width: 540
    height: 380
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications

compression: normal
removePackageScripts: true
npmRebuild: false
