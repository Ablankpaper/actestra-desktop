name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64 foundation
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify source, tests, boundaries, and renderer build
        run: bun run check

      - name: Verify documentation links
        run: bun run docs:check

      - name: Build unsigned local app bundle
        run: bun run dist:dir
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Verify packaged identity and product boundary
        run: bun run verify:package

      - name: Smoke packaged shell from a clean profile
        run: bun run smoke:package
